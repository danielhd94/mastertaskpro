<!-- Template simple y limpio -->
<div class="min-h-screen bg-gray-100 p-4 ">
    <div class="max-w-4xl mx-auto ">


        <h1 *ngIf="isAuthenticated">Bienvenido {{ username }}</h1>


        <!-- Header con navegación programática -->
        <div class="flex justify-between items-center mb-6 ">
            <h1 class="text-3xl font-bold text-blue-600 ">Mi Dashboard</h1>
            <p-toast />
            <p-confirmdialog #cd>
                <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
                    <div class="flex flex-col items-center p-8 bg-surface-0 dark:bg-surface-900 rounded">
                        <div
                            class="rounded-full bg-primary text-primary-contrast inline-flex justify-center items-center h-24 w-24 -mt-20">
                            <i class="pi pi-question !text-5xl"></i>
                        </div>
                        <span class="font-bold text-2xl block mb-2 mt-6">{{ message.header }}</span>
                        <p class="mb-0">{{ message.message }}</p>
                        <div class="flex items-center gap-2 mt-6">
                            <p-button label="Aceptar" (onClick)="onAccept()" styleClass="w-32"></p-button>
                            <p-button label="Cancelar" [outlined]="true" (onClick)="onReject()"
                                styleClass="w-32"></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-confirmdialog>
            <p-button (click)="logout()" label="Logout" />
        </div>

        <p-table [value]="users" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template #header>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                </tr>
            </ng-template>
            <ng-template #body let-user>
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone }}</td>
                </tr>
            </ng-template>
        </p-table>

    </div>
</div>
