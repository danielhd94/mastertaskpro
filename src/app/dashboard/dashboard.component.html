<!-- Template simple y limpio -->
<div class="min-h-screen bg-gray-100 p-4 ">
    <div class="max-w-4xl mx-auto ">


        <h1 *ngIf="isAuthenticated">Bienvenido {{ username }}</h1>


        <!-- Header con navegación programática -->
        <div class="flex justify-between items-center mb-6 ">
            <h1 class="text-3xl font-bold text-blue-600 ">Mi Dashboard</h1>
            <button (click)="logout() " class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 ">
                Cerrar Sesión
            </button>
        </div>

        <div *ngIf="users.length > 0" class="p-4 bg-white rounded-2xl shadow-md">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Usuarios</h2>
            <ul class="list-disc list-inside space-y-2">
                <li *ngFor="let user of users" class="text-blue-600 font-medium hover:text-blue-800 transition-colors">
                    {{ user.name }} {{ user.email }} {{ user.phone }}
                </li>
            </ul>
        </div>

    </div>
</div>
