<!-- Template simple y limpio -->
<div class="min-h-screen bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">

        <!-- Header con navegación programática -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600">Mi Dashboard</h1>
            <button (click)="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                Cerrar Sesión
            </button>
        </div>

        <!-- Componente hijo con @Input y @Output -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <app-tasks [tasks]="tasks" (taskAdded)="onTaskAdded($event)" (taskToggled)="onTaskToggled($event)" />
        </div>

    </div>
</div>
