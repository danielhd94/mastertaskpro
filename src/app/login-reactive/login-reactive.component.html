<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">

        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Iniciar Sesión</h1>

        <form [formGroup]="loginForm" class="space-y-4">
            <p-floatlabel variant="on">
                <input pInputText id="on_label" formControlName="username" autocomplete="off" />
                <label for="on_label">Usuario</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
                <input pInputText id="on_label" formControlName="password" autocomplete="off" />
                <label for="on_label">Contraseña</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
                <input pInputText id="on_label" formControlName="captcha" autocomplete="off" />
                <label for="on_label">Captcha</label>
            </p-floatlabel>

            <p-button label="Primary" [raised]="true" (onClick)="login()">Login</p-button>
        </form>
    </div>
</div>
