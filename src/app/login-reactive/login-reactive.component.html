<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6 ">

        <h1 class="text-2xl font-bold text-center text-blue-600 p-4">Iniciar Sesión</h1>

        <form [formGroup]="loginForm" class="space-y-4 grid">
            <p-floatlabel variant="on">
                <input pInputText id="username " formControlName="username" autocomplete="off " class="w-full" />
                <label for="on_label ">Usuario</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
                <input pInputText id="password" formControlName="password" autocomplete="off " class="w-full" />
                <label for="on_label ">Contraseña</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
                <input pInputText id="captcha" formControlName="captcha" autocomplete="off " class="w-full" />
                <label for="on_label ">Captcha</label>
            </p-floatlabel>

            <p-button label="Login" [raised]="true" (onClick)="login() " class="justify-center w-full"></p-button>
        </form>
    </div>
</div>
