<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">

        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Iniciar Sesión</h1>

        <form [formGroup]="loginForm" class="space-y-4">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username: </label>
            <input id="username" type="text" formControlName="username" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password: </label>
            <input id="password" type="password" formControlName="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            <label for="captcha" class="block text-sm font-medium text-gray-700 mb-1">Captcha: </label>
            <input id="captcha" type="text" formControlName="captcha" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            <button (click)="login()" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">Login</button>
        </form>
    </div>
</div>
