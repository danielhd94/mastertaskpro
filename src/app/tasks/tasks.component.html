<!-- Template muy simple para principiantes -->
<div class="p-6">
    <h2 class="text-2xl font-bold text-blue-600 mb-4">Lista de Tareas</h2>

    <!-- Formulario simple para agregar tarea -->
    <div class="mb-6 p-4 bg-blue-50 rounded-lg">
        <h3 class="font-semibold mb-3">Agregar Nueva Tarea</h3>
        <form (ngSubmit)="addTask()" class="flex gap-3">
            <input type="text" [(ngModel)]="newTaskTitle" name="title" placeholder="Escribe una nueva tarea..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg" />
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
        Agregar
      </button>
        </form>
    </div>

    <!-- Lista simple de tareas -->
    <div *ngIf="tasks.length > 0" class="space-y-3">

        <div *ngFor="let task of tasks" class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg">
            <!-- Checkbox para marcar completada -->
            <input type="checkbox" [checked]="task.completed" (change)="toggleTask(task.id)" class="w-5 h-5" />

            <!-- Título de la tarea -->
            <span class="flex-1" [class.line-through]="task.completed" [class.text-gray-500]="task.completed">
        {{ task.title }}
      </span>

            <!-- Estado visual -->
            <span class="px-2 py-1 text-xs rounded-full" [class]="task.completed ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
        {{ task.completed ? 'Completada' : 'Pendiente' }}
      </span>
        </div>

        <p class="text-gray-500 text-center py-8">No hay tareas. ¡Agrega la primera!</p>

    </div>
</div>
