<!-- Template simple para login -->
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">

        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Iniciar Sesión</h1>

        <!-- Formulario simple -->
        <form (ngSubmit)="login()" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                    Usuario
                </label>
                <input type="text" id="username" [(ngModel)]="username" name="username" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Ingresa tu usuario" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    Contraseña
                </label>
                <input type="password" id="password" [(ngModel)]="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Ingresa tu contraseña" />
            </div>

            <div>
                <label for="captcha" class="block text-sm font-medium text-gray-700 mb-1">
                    Captcha
                </label>
                <input type="text" id="captcha" [(ngModel)]="captcha" name="captcha" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Captcha" />
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
                Iniciar Sesión
            </button>
            <div *ngIf="error">
                <p class="text-red-500">{{ error }}</p>
            </div>
        </form>

        <div class="mt-4 text-center">
            <p class="text-gray-600">
                ¿No tienes cuenta?
                <button type="button" (click)="goToRegister()" class="text-blue-500 hover:text-blue-700 font-medium">
                    Regístrate
                </button>
            </p>
        </div>

    </div>
</div>
